<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>L21 HW Methods and Loops.html</title>
    </head>
    <body>
        <h2>Methods and Loops</h2>

        1.Methods
        <script>
            var soda = ["Fanta", "Coca cola", "Sprite", "Pepsi", "7 up", "Dr pepper", "Mountain dew"];

            for (i = 0; i < soda.length; i++) {
                var text = soda[i] + "<br>";
                document.write(text);
            }
        </script>

        2.Loops
        <script>
            var word = "SoDa";
            document.write(word.toUpperCase());
            document.write("<br>");

            document.write(word.toLowerCase());
            document.write("<br>");

            document.write(word.startsWith('i'));
            document.write("<br>");

            document.write(Math.random());
            document.write("<br>");

            document.write(Math.floor(4.78));
            document.write("<br>");
        </script>
    </body>
</html>
