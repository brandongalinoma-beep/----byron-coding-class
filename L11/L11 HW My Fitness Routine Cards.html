<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>L11 Fitness Routine Card</title>

        <!--Internal CSS-->
        <style>
            /* Page background - sets the colour and font for the whole page */
            body {
                background-color: darkblue;
                font-family: Arial, Helvetica, sans-serif
            }

            /* Box Model - width sets the content area
            padding pushes the text away from edges
            border draws a visible frame around the fitness routine
            margin pushes the fitness routine away from the screen edge */
            .fitness-card {
                background-color: lightblue;
                color: darkslategray;
                width: 260px;
                padding: 25px;
                border: 4px solid blue;
                margin: 30px;
            }

            /* Routine name - blue so it stands out */
            .routine-name {
                color: darkblue;
                font-size: 22px;
            }

            /* Detail rows - dark text on the light background */
            .detail {
                font-weight: bold;
                color: darkslategray;
            }

            /* Cool fact - orange and italic to make it feel special */
            .cool-fact {
                color: darkorange;
                font-style: italic;
            }

        </style>
    </head>
    <body>
        <div class="fitness-card">
            <h2 class="routine-name">Fitness Routine</h2>
            <p class="detail">Exercise: Squats</p>
            <p class="detail">Duration: 15 minutes</p>
            <p class="detail">Difficulty: Easy</p>
            <p class="cool-fact">Cool fact: Exercise helps keep your body strong!</p>
        </div>
    </body>
</html>
