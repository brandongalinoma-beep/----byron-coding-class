<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>L06 HW Book Donation Form</title>
    </head>
    <body>
        <h1><b>My Book Donation Form</h1></b>
        <h3><p><i>Fill in the form below to donate a book</i></p></h3>
        <p>Please fill out the following information if you would like to donate a book.</p>
        <hr>

        <form>
            <fieldset>
                <legend>Book Details</legend>

                <label>Book Name</label><br>
                <input type="text" id="name" placeholder="Enter the full name"><br><br>

                <label>Age Rating Of Book</label><br>
                <input type="text" id="pid" placeholder="Enter the Age Rating"><br><br>

                <label>Date of When Book was Donated</label><br>
                <input type="date" id="dob"><br>
            </fieldset>
        </form>
    </body>
</html>
