<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L07 My Color Card</title>

    <!--internal CSS-->
    <style>
        /*Uniersal selector - applies to everythinh on page */
        *{
            font-size: 16px;
        }

        /*Element Selector */
        body{
            background-color: lightgray;
        }

        h1 {
            color: darkblue;
        }

        h2 {
            color: purple
        }
        

        p{
            color: dimgray
        }


        /* Class Selctor */
        .my-detai{
            color: darkgreen;
            font-weight: bold;
        } 

        /* ID Selector */
        #my-card {
            background-color: lightcyan;
        }
    </style>
</head>
<body>
    <h1>My Color Card</h1>


    <!--Inline CSS: Add style="color:____;" inside this p tag -->
    <p style="color: crimson;">
        Hi! This is my very own webpage
    </p>

    <div id="my-card">
        <h2>About Me</h2>

        <p class="my-detail">My name is Byron.</p>
        <p class="my-detail">My favourite colour is red.</p>
        <p class="my-detail">My favourite subject is Maths.</p>
        <p class="my-detail">My favourite food is pasta.</p>
    </div>

    <h2>My Favourite Things</h2>

    <p>My favourite animal is a dog.</p>
    <p>My favourite sport is Basket-ball.</p>
    <p>My favourite movie is School bus graveyard</p>
</body>
</html>
