<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mont Fleuri Weather</title>

    <link rel="stylesheet" href="style-hw.css">
</head>

<body>

    <div class="weather-container">

        <h1>🇸🇨 Mont Fleuri Weather</h1>
        <p class="location">Mont Fleuri, Mahé, Seychelles</p>

        <div class="weather-card">

            <div id="weather-icon" class="weather-icon">☀️</div>

            <h2 id="temperature">Loading...</h2>

            <p id="condition">Getting weather...</p>

            <div class="weather-info">

                <div class="info-box">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">36%</strong>
                </div>

                <div class="info-box">
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="wind">75 km/h</strong>
                </div>

                <div class="info-box">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feels">36°C</strong>
                </div>

            </div>

        </div>

        <h2 class="forecast-title">7-Day Forecast</h2>

        <div id="forecast" class="forecast">
            Loading forecast...
        </div>

        <p class="credit">
            Weather data provided by Byron.com
        </p>

    </div>
</body>
</html>
