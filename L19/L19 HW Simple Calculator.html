<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L19 HW Simple Calculator</title>
</head>
<body>
    <h1>Simple Calculator</h1>
    <h2><b><p>Sum of two Numbers is :</p></b></h2>

    <p id="result"></p>
    <p id="add"></p>
    <p id="sub"></p>
    <p id="mul"></p>
    <p id="div"></p>

    <script>
        // PART 1: two variables
        // Make num1 with the value 10 and num2 with the value 2.

        var num1 = 52;
        var num2 = 26;
        var num3 = 42;

        // PART 2: the calculations
        // Make four variables: add, sub, mul and div.

        var add = num1 + num2;
        var sub = num3 - num2;
        var mul = num1 * num3;
        var div = num1 / num2;


        // PART 3: show the answers
        // Use document.getElementById() and .innerHTML.

        document.getElementById("add").innerHTML = "The added value is: " + add;
        document.getElementById("sub").innerHTML = "The subtracted value is: " + sub;
        document.getElementById("mul").innerHTML = "The multiplied value is: " + mul;
        document.getElementById("div").innerHTML = "The divided value is: " + div;

    </script>
</body>
</html>
